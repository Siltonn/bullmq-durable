name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pnpm 11 (our pinned packageManager) requires Node >= 22.13, so the dev
        # toolchain runs on 22+. The published library still supports Node >= 18
        # at runtime (no Node 22-only APIs are used in src/).
        node-version: [22, 24]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check

      # Redis is available, so the integration tests run here too.
      - run: pnpm test
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379

      - run: pnpm run build
